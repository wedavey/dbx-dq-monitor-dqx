resources:
  jobs:
    # Run after every deployment. Creates the tables and views and loads the check YAML from the wheel
    # into the DQX checks table.
    dq_deploy_config:
      name: dq-deploy-config-${bundle.target}
      description: Create framework tables and views, load the check YAML into the checks table.
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.ops_email}
      environments:
        - environment_key: default
          spec: &dq_env_spec
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: deploy_config
          environment_key: default
          python_wheel_task:
            package_name: dq_monitor
            entry_point: dq-deploy-config
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.dq_schema}"
              - "--check-files"
              - "${var.check_files}"

    # The scheduled run: DQX runs every table that has checks in the checks table.
    dq_daily_run:
      name: dq-daily-run-${bundle.target}
      description: Execute every deployed check with DQX and append the summary metrics to results.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 5 * * ?"
        timezone_id: Australia/Sydney
        pause_status: ${var.schedule_status}
      email_notifications:
        on_failure:
          - ${var.ops_email}
      environments:
        - environment_key: default
          spec: *dq_env_spec
      tasks:
        - task_key: run_checks
          environment_key: default
          python_wheel_task:
            package_name: dq_monitor
            entry_point: dq-run
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.dq_schema}", "--max-workers", "${var.max_workers}"]
