[project]
name = "dq_monitor"
version = "0.1.0"
description = "Config-driven data quality monitoring service for Databricks Free Edition, built on DQX"
requires-python = ">=3.10"
# pyspark, pandas and databricks-sdk come with the Databricks runtime. DQX is the compute engine.
dependencies = ["pyyaml>=6", "databricks-labs-dqx>=0.16,<0.17"]

[project.optional-dependencies]
# delta-spark: the checks table is written with DQX's Delta-only replaceWhere/DELETE paths.
dev = ["pytest>=8", "pyspark>=4.0", "delta-spark>=4.0", "pandas", "pyarrow"]

[project.scripts]
# DQ monitoring service: each entry point is one task in a job (python_wheel_task -> entry_point).
dq-deploy-config = "dq_framework.cli:deploy_config_main"
dq-run = "dq_framework.cli:run_main"
dq-validate-config = "dq_framework.cli:validate_config_main"
dq-seed-synthetic = "dq_framework.cli:seed_synthetic_main"
dq-verify-synthetic = "dq_framework.cli:verify_synthetic_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dq_framework"]  # sql/ and config/ ship as package data

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["spark: needs a Spark session"]
